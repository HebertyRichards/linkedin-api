# Example resume with made-up data. Copy it to curriculo.yaml (git-ignored) and replace the content:
#     cp curriculo.example.yaml curriculo.yaml
# Then set RESUME_FILE=curriculo.yaml in .env. Dates are "YYYY-MM" in quotes.

# Printed on the PDF only. This block is never sent to the AI.
contato:
  nome: Ana Exemplo
  telefone: "(00) 00000-0000"
  email: ana@example.com
  linkedin: https://www.linkedin.com/in/ana-exemplo
  github: https://github.com/ana-exemplo
  portfolio: ""
  cidade: São Paulo, SP

titulo: Desenvolvedora Full Stack
idiomas: [Português (nativo), Inglês (B1)]
perfil_busca:
