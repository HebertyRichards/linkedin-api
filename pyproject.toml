[project]
name = "linkedin-api"
version = "0.1.0"
description = "Worker that alerts by email or WhatsApp when a new LinkedIn Easy Apply job shows up."
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes: unused imports/variables, undefined names
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "DTZ",   # timezone-aware datetimes only
    "T20",   # no print() in application code
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # pytest asserts, fake secrets

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = "results/.pytest_cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
