name: deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Merge into main and tag there."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.71.0

      - name: Deploy the tagged commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_SERVICE }}" --ci
